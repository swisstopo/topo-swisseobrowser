# Checks that the generated blocks match catalog/: the configurations in swisseo-browser.html and the
# layer verification checklist in README.md are written by tools/build-catalog.py and must not be
# edited by hand. After changing catalog/, run
#   python3 tools/build-catalog.py --env int --write-readme
# and commit the result, otherwise this job fails and names the file.
# It also builds the production variant, so a catalogue that would leave production without layers is
# caught before it is merged into main.
# Actions are pinned to commit SHAs: tags can be moved, commits cannot.
name: Catalogue

on:
  push:
    branches: [main, int]
    paths:
      - catalog/**
      - swisseo-browser.html
      - README.md
      - tools/build-catalog.py
      - .github/workflows/catalog-check.yml
  pull_request:
    paths:
      - catalog/**
      - swisseo-browser.html
      - README.md
      - tools/build-catalog.py
      - .github/workflows/catalog-check.yml

permissions:
  contents: read

jobs:
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 -m pip install --quiet --disable-pip-version-check "PyYAML==6.0.3"

      - name: The page and the README must match catalog/
        run: python3 tools/build-catalog.py --env int --check

      - name: The production build must still offer something
        run: |
          cp swisseo-browser.html /tmp/prod.html
          python3 tools/build-catalog.py --env prod --page /tmp/prod.html
          grep -q 'const CONFIGS = {' /tmp/prod.html ||
            { echo "::error::the production build has no configurations"; exit 1; }
