# Publishes the single-file swissEO Browser to GitHub Pages, the integration environment:
#   https://swisstopo.github.io/topo-swisseobrowser/
# Branch model: int is integration (deployed here), a merge of int into main deploys to production
# (deploy-prod.yml). Only swisseo-browser.html (as index.html), the self-hosted libraries in lib/ and
# the help pages in docs/ are deployed; the upstream Copernicus Browser sources are not built or published.
# Actions are pinned to commit SHAs (issue #21): tags can be moved, commits cannot.
name: Deploy swissEO Browser to GitHub Pages

on:
  push:
    branches: [int]
    paths:
      - swisseo-browser.html
      - README.md
      - public/previews/**
      - docs/**
      - lib/**
      - tools/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assemble site
        run: |
          mkdir -p _site/public/previews
          cp swisseo-browser.html _site/index.html
          cp swisseo-browser.html _site/swisseo-browser.html
          # the README is fetched by the page when VERIFIED_IDS is not injected, and read by people
          cp README.md _site/README.md
          # layer thumbnails: only the Copernicus Browser previews the page references
          grep -oE '"[A-Z-]+-[0-9a-f]{6}-[^"]+\.png"' swisseo-browser.html | tr -d '"' | sort -u |
            while read -r f; do cp "public/previews/$f" _site/public/previews/; done
          ls _site/public/previews
          # help and tutorial, opened by the (i) button of the map
          cp -r docs _site/docs
          # self-hosted runtime libraries (generated by tools/vendor)
          cp -r lib _site/lib
          touch _site/.nojekyll

      - name: Apply the layer verification checklist of README.md
        run: python3 tools/apply-verification.py _site/index.html _site/swisseo-browser.html

      - name: Check the site serves its libraries itself
        run: bash tools/check-dist.sh _site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
