# Publishes the single-file swissEO Browser to GitHub Pages, the integration environment:
#   https://swisstopo.github.io/topo-swisseobrowser/
# Branch model: int is integration (deployed here), a merge of int into main deploys to production
# (deploy-prod.yml). Only swisseo-browser.html (as index.html), the self-hosted libraries in lib/ and
# the help pages in docs/ are deployed; the upstream Copernicus Browser sources are not built or published.
# Actions are pinned to commit SHAs (issue #21): tags can be moved, commits cannot.
name: Deploy swissEO Browser to GitHub Pages

on:
  push:
    branches: [int]
    paths:
      - swisseo-browser.html
      - catalog/**
      - README.md
      - public/previews/**
      - docs/**
      - lib/**
      - tools/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python dependencies of the build
        run: python3 -m pip install --quiet --disable-pip-version-check "PyYAML==6.0.3"

      - name: Assemble site
        run: |
          mkdir -p _site/public/previews
          cp swisseo-browser.html _site/index.html
          cp swisseo-browser.html _site/swisseo-browser.html
          # the README is fetched by the page when VERIFIED_IDS is not injected, and read by people
          cp README.md _site/README.md
          # layer thumbnails of the layers this environment offers (the catalogue knows which)
          python3 tools/build-catalog.py --env int --previews "$RUNNER_TEMP/previews.txt"
          while read -r f; do cp "public/previews/$f" _site/public/previews/; done < "$RUNNER_TEMP/previews.txt"
          ls _site/public/previews
          # help and tutorial, opened by the (i) button of the map
          cp -r docs _site/docs
          # self-hosted runtime libraries (generated by tools/vendor)
          cp -r lib _site/lib
          touch _site/.nojekyll

      # Writes the catalogue into the page: which configurations exist, in which order, with which
      # layers, and which layers are verified (the BETA labels). Integration offers everything.
      # --check first, so a hand edit of a generated block is reported before anything is published.
      - name: Apply the catalogue
        run: |
          python3 tools/build-catalog.py --env int --check
          python3 tools/build-catalog.py --env int --page _site/index.html --page _site/swisseo-browser.html

      # Only the integration version carries this: production must stay indexable. The committed files
      # therefore look like production and this step adds the tag, so a broken step can at worst let
      # the integration version be indexed, never hide production from search engines.
      # (A robots.txt cannot do this here: on a project page it is served under /topo-swisseobrowser/
      # and crawlers only read the one at the root of swisstopo.github.io, which is another repository.)
      - name: Keep the integration version out of search engines
        run: |
          for f in _site/index.html _site/swisseo-browser.html _site/docs/index.html; do
            grep -q '^<!-- robots:marker' "$f" || { echo "::error::the robots marker is missing from $f"; exit 1; }
            sed -i 's|^<!-- robots:marker.*-->$|<meta name="robots" content="noindex, nofollow">|' "$f"
            grep -q '^<meta name="robots" content="noindex, nofollow">$' "$f" ||
              { echo "::error::noindex was not inserted into $f"; exit 1; }
          done
          echo "noindex set on the integration version"

      - name: Check the site serves its libraries itself
        run: bash tools/check-dist.sh _site int

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
