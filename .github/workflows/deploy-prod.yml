# Deploys the swissEO Browser to production:
#   s3://s3-topo-satromo-swisseobrowser behind CloudFront, https://swisseobrowser.swisstopo.admin.ch
# Branch model: int is integration (GitHub Pages, pages.yml); merging int into main deploys here.
# Who may deploy: pushes to main are controlled by the branch protection of main (pull request +
# review); a manual run additionally requires the admin role on the repository.
# AWS access: OIDC only (no stored keys). The IAM trust policy is limited to
# repo:swisstopo/topo-swisseobrowser:ref:refs/heads/main, so this workflow must run from main.
# (Alternative: a "production" environment with required reviewers; that changes the OIDC sub claim
# to "...:environment:production" and needs the IAM trust policy updated first.)
# Secrets: AWS_ROLE_ARN (the role to assume), CLOUDFRONT_DISTRIBUTION_ID.
# Actions are pinned to commit SHAs (issue #21): tags can be moved, commits cannot.
name: Deploy swissEO Browser to production

on:
  push:
    branches: [main]
    paths:
      - swisseo-browser.html
      - README.md
      - public/previews/**
      - docs/**
      - lib/**
      - tools/**
      - .github/workflows/deploy-prod.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  BUCKET: s3-topo-satromo-swisseobrowser
  AWS_REGION: eu-central-1
  PROD_URL: https://swisseobrowser.swisstopo.admin.ch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and, for manual runs, a repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] ||
            { echo "::error::production deploys run from main only (the AWS OIDC trust is limited to refs/heads/main)"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
            echo "$GITHUB_ACTOR has '$perm' permission"
            [ "$perm" = "admin" ] ||
              { echo "::error::only repository admins may start a production deploy by hand"; exit 1; }
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble the site
        run: |
          mkdir -p _site/public/previews
          cp swisseo-browser.html _site/index.html
          cp swisseo-browser.html _site/swisseo-browser.html
          cp README.md _site/README.md
          grep -oE '"[A-Z-]+-[0-9a-f]{6}-[^"]+\.png"' swisseo-browser.html | tr -d '"' | sort -u |
            while read -r f; do cp "public/previews/$f" _site/public/previews/; done
          cp -r docs _site/docs
          cp -r lib _site/lib

      - name: Apply the layer verification checklist of README.md
        run: python3 tools/apply-verification.py _site/index.html _site/swisseo-browser.html

      - name: Check the site serves its libraries itself
        run: bash tools/check-dist.sh _site

      # Prints the claims of the OIDC token (never the token itself). The "sub" and "aud" below are exactly
      # what the trust policy of the AWS role has to accept; a mismatch is reported by STS as
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      - name: Show the OIDC claims the AWS role must trust
        continue-on-error: true
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
                python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$tok"
          python3 -c '
          import base64, json, os, sys
          p = sys.argv[1].split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))
          for k in ("iss", "aud", "sub", "repository", "ref", "event_name"):
              if k in c: print(f"{k:11} {c[k]}")
          iss, aud, sub = c.get("iss"), c.get("aud"), c.get("sub")
          # also an annotation and a job summary, so the claims can be read without opening the log
          print(f"::notice title=OIDC claims for the AWS trust policy::iss={iss} aud={aud} sub={sub}")
          rows = "".join(f"| `{k}` | `{c[k]}` |\n" for k in ("iss", "aud", "sub") if k in c)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as f:
              f.write("### OIDC claims sent to AWS\n\n| claim | value |\n| --- | --- |\n" + rows)
          ' "$tok"
          case "${{ secrets.AWS_ROLE_ARN }}" in
            arn:aws:iam::[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]:role/*)
              echo "AWS_ROLE_ARN  format looks correct" ;;
            *) echo "::warning::AWS_ROLE_ARN is not of the form arn:aws:iam::<12-digit account>:role/<name>" ;;
          esac

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # One cache-control per pass (aws s3 sync applies a single value; filters: last match wins).
          # lib/ files carry their version in the name, so they can be cached as immutable; .mjs gets an
          # explicit JavaScript MIME type because module workers and import() enforce it strictly.
          S="aws s3 sync _site s3://$BUCKET --no-progress"
          $S --exclude "*" --include "lib/*" --exclude "lib/*.mjs" \
             --cache-control "public,max-age=31536000,immutable"
          $S --exclude "*" --include "lib/*.mjs" \
             --cache-control "public,max-age=31536000,immutable" --content-type "text/javascript"
          $S --exclude "*" --include "public/previews/*" --cache-control "public,max-age=86400"
          $S --exclude "*" --include "docs/*" --cache-control "public,max-age=3600"
          # the page, its copy and the README: short cache, refreshed by the invalidation below
          $S --exclude "lib/*" --exclude "public/previews/*" --exclude "docs/*" \
             --cache-control "public,max-age=300,must-revalidate"
          # remove objects that are no longer part of the site (uploads above are newer, so this only deletes)
          aws s3 sync _site "s3://$BUCKET" --delete --no-progress

      - name: Invalidate the CloudFront cache
        run: |
          # "/*" counts as a single invalidation path, so a full invalidation per deploy stays free
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
                 --paths "/*" --query Invalidation.Id --output text)
          echo "invalidation $id created"
          # waiting needs cloudfront:GetInvalidation as well; the invalidation is on its way either way,
          # so a role without that permission only loses the wait, not the deploy
          aws cloudfront wait invalidation-completed \
                 --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --id "$id" ||
            echo "::warning::could not wait for invalidation $id (needs cloudfront:GetInvalidation); it still runs"

      - name: Smoke test
        run: |
          # the edges may serve the previous page for a moment after the invalidation, so retry
          for i in 1 2 3 4 5 6; do
            curl -fsS "$PROD_URL/?smoke=$GITHUB_RUN_ID.$i" -o page.html &&
              grep -q 'const VERIFIED_IDS = \[' page.html && break
            echo "attempt $i: not the new page yet"
            sleep 20
          done
          grep -q 'const VERIFIED_IDS = \[' page.html ||
            { echo "::error::the deployed page does not carry the injected VERIFIED_IDS"; exit 1; }
          mjs=$(grep -oE '"lib/maplibre-gl-[0-9.]+\.mjs"' page.html | tr -d '"' | head -1)
          curl -fsS "$PROD_URL/$mjs" -o lib.mjs -D headers.txt
          tr -d '\r' < headers.txt | grep -i '^content-type:' | grep -qi 'text/javascript' ||
            { echo "::error::$mjs is not served as text/javascript:"; grep -i '^content-type:' headers.txt; exit 1; }
          echo "smoke test OK: $PROD_URL"
