# The configurations of the swissEO Browser: what the pull-down offers, in this order.
#
# A configuration lists its layers in groups; the same layer can appear in several configurations.
# The layers themselves are in catalog/layers.yaml; a layer that is not verified there carries the
# BETA label and is removed from these groups in the production build.
#
#   beta: true   the whole configuration is only offered on integration, with a BETA label
#   highlights   the key of a story set in HIGHLIGHTS in the page (texts stay there); a configuration with
#                highlights may have no groups (groups: []): it then lists only the stories
#   masks        { vegetation: forest }: the vegetation mask of every layer of this configuration that
#                starts with the habitat map (masks.vegetation forest or vegetation in catalog/layers.yaml),
#                e.g. the forest in Forest or the BLW Nutzungsflaechen without forest in Agriculture; a layer
#                with a specific mask (tlm for analyst) keeps it
#
# The key is also the themeId of a permalink (upper case, no dashes). tools/build-catalog.py
# writes this into the page; never edit the generated block there by hand.
#
# AFTER EDITING THIS FILE run, in the repository folder (Windows: python instead of python3):
#   python3 tools/build-catalog.py --env int --write-readme
# then reload localhost with Ctrl+F5 and commit this file, swisseo-browser.html and README.md together
# (README, After editing the catalogue).

configurations:
  - key: DEFAULT
    name: "Default"
    beta: false
    groups:
      - title: "Composites"
        layers: ["true", "nir", "urban", "hon", "swir", "agri", "geo", "barren"]
      - title: "Indices"
        layers: ["ndvi", "ndwi", "ndmi", "ndsi", "nbr", "aot", "savi", "vhi", "vhiveg", "ndvidiff"]
      - title: "Masks & quality"
        layers: ["scl", "cloud", "terrain"]
  - key: AGRICULTURE
    name: "Agriculture"
    beta: false
    # the indices Agroscope recommends (issue #52), on the farmland of the BLW Nutzungsflaechen (every class but forest)
    masks: { vegetation: "lnf:a.dw.dp.r.o.dk.g.s.h.u.so.v" }
    groups:
      - title: "Layers"
        layers: ["true", "ndvi", "evi", "ndre", "mtvi2"]
  - key: DROUGHT
    name: "Drought"
    beta: false
    groups:
      - title: "Layers"
        layers: ["true", "ndvi", "evi", "ndmi", "mstress", "vhi", "vhiveg", "ndvidiff", "ndvidiff2", "ndvidiff22", "ndvidiff23", "ndviz", "discoch", "nddi", "nddichg", "analyst"]
  - key: DROUGHT2026
    name: "Drought 2026"
    beta: false
    highlights: drought2026
    # only the highlights: each story opens its own layer (true colour), so no layer list
    groups: []
  - key: FOREST
    name: "Forest"
    beta: false
    masks: { vegetation: "forest" }
    groups:
      - title: "Layers"
        layers: ["true", "ndvi", "evi", "vhi", "vhidef", "vhiext", "ndvidiff", "ndvidiff2", "ndvidiff22", "ndvidiff23", "ndviz", "discoch", "analyst", "nbr", "ndmi", "fdc"]
