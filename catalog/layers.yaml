# The layers of the swissEO Browser: which exist, and whether they are verified.
#
# The layer DEFINITIONS (bands, formulas, colour ramps, the JavaScript of an index) stay in
# swisseo-browser.html. This file decides only what is shown where:
#   verified: false  the layer carries the BETA label and is NOT offered in production
#   verified: true   no label, offered everywhere
# Only tick a layer as verified when it has really been checked (see README, Layer verification).
#
# label and note are used for the generated checklist in README.md. The order is the order of the
# layer definitions in the page. tools/build-catalog.py reads this file; never edit the generated
# block in the page or the checklist in the README by hand.

layers:
  - id: "true"
    label: "True color"
    verified: true
  - id: "nir"
    label: "False color"
    verified: true
  - id: "urban"
    label: "False color (urban)"
    verified: false
  - id: "swir"
    label: "SWIR"
    verified: true
  - id: "agri"
    label: "Agriculture"
    verified: false
  - id: "geo"
    label: "Geology 12, 8, 2"
    verified: false
  - id: "ndvi"
    label: "NDVI"
    verified: true
  - id: "ndwi"
    label: "NDWI"
    verified: false
  - id: "ndmi"
    label: "Moisture index"
    verified: false
  - id: "ndsi"
    label: "NDSI"
    verified: false
  - id: "nbr"
    label: "Normalized Burn Ratio (NBR)"
    verified: false
  - id: "aot"
    label: "Aerosol optical thickness"
    verified: false
  - id: "scl"
    label: "Scene classification map"
    verified: true
  - id: "cloud"
