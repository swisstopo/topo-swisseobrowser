# The layers of the swissEO Browser: which exist, whether they are verified, and the masks they start with.
#
# The layer DEFINITIONS (bands, formulas, colour ramps, the JavaScript of an index) stay in
# swisseo-browser.html. This file decides only what is shown where, and how a layer starts:
#   verified: false  the layer carries the BETA label and is NOT offered in production
#   verified: true   no label, offered everywhere
#   masks:           the masks that are on when the layer is opened (the user can still change them):
#                      cloud, shadow, terrain   true or false (only Sentinel-2 layers can be masked)
#                      illumination             true or false: the low-illumination mask (solar incidence
#                                               angle >= 70 degrees, adjustable in the layer menu); off
#                                               when missing, as on every layer today
#                      vegetation               off, forest or vegetation (the habitat map of the date),
#                                               or any other value of the vegetationMask URL parameter
#                                               (README, URL parameters), e.g. tlm or lfi-broad:30.85
#                    A layer without masks starts without any. A configuration can replace the vegetation
#                    mask (catalog/configurations.yaml, masks: vegetation), except where it is off here.
# Only tick a layer as verified when it has really been checked (see README, Layer verification).
#
# label and note are used for the generated checklist in README.md. The order is the order of the
# layer definitions in the page. tools/build-catalog.py reads this file; never edit the generated
# block in the page or the checklist in the README by hand.
#
# AFTER EDITING THIS FILE run, in the repository folder (Windows: python instead of python3):
#   python3 tools/build-catalog.py --env int --write-readme
# then reload localhost with Ctrl+F5 and commit this file, swisseo-browser.html and README.md together
# (README, After editing the catalogue).

layers:
  - id: "true"
    label: "True color"
    verified: true
    masks: { cloud: false, shadow: false, terrain: false }
  - id: "nir"
    label: "False color"
    verified: true
    masks: { cloud: false, shadow: false, terrain: false }
